# Windows installer build. Run it from the Actions tab (pick the brand), or push a v* tag.
name: Build installer
on:
  workflow_dispatch:
    inputs:
      brand:
        description: Brand pack
        type: choice
        options: [iss, promnatic]
        default: iss
      theme:
        description: Default look (either can be switched in Settings)
        type: choice
        options: [flagship, daylight]
        default: flagship
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    env:
      BRAND: ${{ inputs.brand || 'iss' }}
      THEME: ${{ inputs.theme || 'flagship' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: node tools/dist.mjs --brand ${{ env.BRAND }} --theme ${{ env.THEME }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ env.BRAND }}-${{ env.THEME }}
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
